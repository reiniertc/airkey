; ESP32 Bluetooth -> Sonos bridge
; Vereist een klassieke ESP32 (WROOM-32 of WROVER) — de S2/S3/C3/C6
; hebben geen Bluetooth Classic en kunnen dus geen A2DP ontvangen.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; Bluetooth + WiFi + audio-encoder past niet in de standaard app-partitie
board_build.partitions = huge_app.csv

lib_deps =
    https://github.com/pschatzmann/ESP32-A2DP.git
    https://github.com/pschatzmann/arduino-audio-tools.git

build_flags =
    -DCORE_DEBUG_LEVEL=1
